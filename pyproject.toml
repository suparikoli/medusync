[project]
name = "medusync"
authors = [{ name = "Mithtech Innovative Solutions PVT LTD", email = "mithtech.is@gmail.com" }]
description = "Two-way sync between a Frappe/ERPNext site and a Medusa v2 backend."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["B904", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
